services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: surbibor
      POSTGRES_PASSWORD: surbibor
      POSTGRES_DB: surbibor
    ports:
      - "5432:5432"
    volumes:
      - surbibor-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surbibor -d surbibor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local SMTP catcher: the backend sends mail to localhost:1025 and you can read it
  # at http://localhost:8025. Nothing is delivered to real inboxes.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  surbibor-postgres-data:
